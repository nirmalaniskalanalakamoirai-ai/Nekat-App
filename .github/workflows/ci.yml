# CI dasar NEKAT (T-012, ADR-0001 §3.4; hardening T-045a).
# Tiga job paralel: verifikasi (install lockfile beku → lint → format → typecheck → unit test → build),
# audit dependensi produksi, dan pindai rahasia (gitleaks).
# Semua action dipin ke commit SHA penuh; Dependabot (.github/dependabot.yml) memperbaruinya.
# Belum ada di sini (menyusul):
#   - E2E Playwright                                → T-043/T-044
#   - Sisa T-045: deploy staging, backup DB, naik ke Node Active LTS,
#     pin image gitleaks per digest, branch protection
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  verifikasi:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Database sekali pakai untuk tes integrasi skema (T-013). Pin per digest menyusul di T-045.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nekat
          POSTGRES_PASSWORD: nekat_tes
          POSTGRES_DB: nekat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nekat -d nekat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Versi pnpm diambil dari field "packageManager" di package.json.
      # SHA ini juga ditandai v4.4.0 di upstream; label v5.0.0 dipakai agar Dependabot membaca versi dengan benar.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (lockfile beku)
        run: pnpm install --frozen-lockfile

      - name: Lint (termasuk aturan batas modul)
        run: pnpm lint

      - name: Cek format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & integrasi test
        run: pnpm test
        env:
          # Kredensial khusus container tes sekali pakai, bukan rahasia.
          DATABASE_URL_TEST: postgres://nekat:nekat_tes@localhost:5432/nekat_test # gitleaks:allow

      - name: Build semua app & paket
        run: pnpm build

  audit:
    name: Audit dependensi produksi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SHA ini juga ditandai v4.4.0 di upstream; label v5.0.0 dipakai agar Dependabot membaca versi dengan benar.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Job ini tidak menjalankan install, jadi store pnpm tidak ada; tanpa ini
          # langkah simpan-cache otomatis gagal ("Path Validation Error").
          package-manager-cache: false

      # Hanya dependensi produksi (--prod): kerentanan dev-only tidak menggagalkan CI.
      # --audit-level=high: temuan moderate/low hanya dilaporkan, tidak menggagalkan CI.
      # Tidak perlu install; pnpm membaca pnpm-lock.yaml.
      - name: pnpm audit (high ke atas)
        run: pnpm audit --prod --audit-level=high

  rahasia:
    name: Pindai rahasia (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # seluruh riwayat, agar rahasia di commit lama juga terdeteksi
          persist-credentials: false

      # CLI gitleaks lewat image resmi (tanpa gitleaks-action yang butuh lisensi untuk akun organisasi).
      # TODO T-045: pin image per digest (@sha256:...); registry tidak terjangkau saat T-045a.
      - name: gitleaks
        run: |
          # safe.directory: repo di-mount dengan pemilik berbeda dari user di dalam container.
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --redact --verbose --no-banner
